<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新品 SOP · SQ-AMAZON-TOOLBOX</title>
<style>
:root{--bg:#f2fbfd;--card:#fff;--ink:#12333f;--sub:#6b93a3;--line:#d9f0f6;--deep:#0e7490;--accent:#0891b2;--turq:#22d3ee}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--ink);padding:30px 26px}
.wrap{max-width:1000px;margin:0 auto}
.hd{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.hd .no{font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:3px 8px}
.hd h1{font-size:22px;color:var(--deep)}
.intro{font-size:13px;color:var(--sub);line-height:1.75;margin-bottom:18px;max-width:760px}
.check{background:#fdf6e3;border-left:3px solid #e8c98a;border-radius:0 8px 8px 0;padding:11px 14px;margin-bottom:22px}
.check b{font-size:12px;color:#8a6d1f;display:block;margin-bottom:5px}
.check li{font-size:12.5px;color:#7a5f18;line-height:1.8;margin-left:16px}
.grp{margin-bottom:22px}
.grp h2{font-size:13px;color:var(--deep);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grp h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--turq);box-shadow:0 3px 12px rgba(34,211,238,.14);transform:translateY(-1px)}
.card b{font-size:13.5px;color:var(--ink);display:block;margin-bottom:5px}
.card p{font-size:12px;color:var(--sub);line-height:1.6}
.card .gl{display:inline-block;margin-top:7px;font-size:10.5px;line-height:1.4;color:#0e8aa8;text-decoration:none;border:1px solid #d3ecf4;background:#fbfeff;border-radius:5px;padding:1px 7px;cursor:pointer;transition:.15s}
.gl:hover{color:#0e7490;border-color:#a9dcea;background:#f0fbfe}.card .gl:hover{background:#e6fafc;border-color:#22d3ee}
.card.todo{background:#fbfdff;border-style:dashed;cursor:default}
.card.todo:hover{transform:none;box-shadow:none;border-color:var(--line)}
.card.todo b{color:#7c9aa8}
.tag{display:inline-block;font-size:10.5px;color:#8a6d1f;background:#fdf6e3;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
<div class="hd"><span class="no">01</span><h1>新品 SOP</h1></div><p class="intro">从备货到下架复盘的全流程排期。一个产品建一个计划，按上架日自动换算 25 个节点日期。</p><div class="check"><b>开动前先确认</b><ul><li>这个品的目标毛利率算过了吗（用板块 04 的利润计算器）</li><li>上架日定了没？物流头程天数倒推过没有</li></ul></div><div class="grp"><h2>排期与执行</h2><div class="cards"><div class="card" onclick="openTool('sop-launch','推新品 SOP')"><b>推新品 SOP</b><p>25 节点清单 · 按上架日排期 · 多计划管理</p><a class="gl" href="../guides/guide-sop-launch.html" target="_blank" onclick="event.stopPropagation()">📖 使用说明</a></div></div></div><div class="grp"><h2>上架后复盘</h2><div class="cards"><div class="card todo"><b>上架后复盘<span class="tag">规划中</span></b><p>规划中 · 60/90 天四指标打分，判断加投还是清货</p></div></div></div></div>
<script>
function openTool(fid,name){
  try{
    var t=window.parent;
    if(t&&t!==window&&t.openTool){t.openTool(fid,name);return false;}
  }catch(e){}
  location.href=fid+'.html';return true;
}
</script>
</body>
</html>
