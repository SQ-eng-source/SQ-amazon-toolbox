<style>
:root{
  --bg:#f2fbfd; --card:#ffffff; --ink:#12333f; --sub:#6b93a3; --line:#d9f0f6;
  --deep:#0e7490; --accent:#0891b2; --turq:#22d3ee;

*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
html,body{height:100%}
body{display:flex;background:var(--bg);color:var(--ink)}
aside{width:258px;flex-shrink:0;overflow-y:auto;color:var(--ink);
  background:linear-gradient(180deg,#e6fafc 0%,#d2f3f9 60%,#c8eef7 100%);
  border-right:1px solid #bfe7f2}
.brand{padding:22px 18px 16px;border-bottom:1px solid #b3e2ef}
.brand h1{font-size:17px;letter-spacing:.5px;color:#0e7490}
.brand h1 span{color:#0891b2}
.brand p{font-size:11px;color:#6b93a3;margin-top:4px}
.group{margin-top:14px;padding:0 10px}
.group-title{font-size:11px;font-weight:700;color:#0e7490;letter-spacing:1.2px;padding:0 8px 6px;display:flex;align-items:center;gap:6px}
.group-title::after{content:"";flex:1;height:1px;background:#b3e2ef}
.nav-item{display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:none;border-radius:10px;font-size:13.5px;color:#155e75;cursor:pointer;margin-bottom:3px;line-height:1.35;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.75)}
.nav-item.active{background:linear-gradient(90deg,#22d3ee33,#ffffffcc);color:#0e7490;font-weight:700;box-shadow:inset 3px 0 0 #22d3ee,0 2px 6px rgba(34,211,238,.15)}
.nav-item small{display:block;font-size:11px;color:#6b93a3;font-weight:400;margin-top:2px}
.nav-item.active small{color:#0891b2}
.nav-item .cnt{float:right;font-size:10px;color:#94b8c6;font-weight:400;padding-top:2px}
main{flex:1;display:flex;flex-direction:column;height:100%}
header{padding:14px 24px;background:linear-gradient(90deg,#ffffff,#f2fbfd);border-bottom:1px solid #d9f0f6;display:flex;align-items:center;gap:10px}
header .dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#67e8f9,#0891b2)}
header span{font-size:15px;font-weight:700;color:#0e7490}
header .crumb{font-size:12px;color:#6b93a3;font-weight:400}
header a{font-size:11.5px;color:#0891b2;margin-left:auto;text-decoration:none;border:1px solid #bfe7f2;background:#fff;padding:5px 10px;border-radius:7px}
header a:hover{background:#e6fafc}
iframe{flex:1;border:none;width:100%}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#a5dfeb;border-radius:4px}

<body data-page-node-id="QnhlvyDPoEjkmRkvSmmFX3">
<aside data-page-node-id="IvQYh8oA9iFIrHgES80IMz">
  <div class="brand" data-page-node-id="HT4jDSEaF1PNRxOPzn9Q46">
    <h1 data-page-node-id="z6ufDI84BP8Ei6vjbILmTX">🏝 SQ-AMAZON<span data-page-node-id="3JwMfWpkkFdyH7OJN3NyAl">-TOOLBOX</span></h1>
    <p data-page-node-id="AnW3t3XnA4gJ0HCGWD3ZtE">7 大板块 · 按运营工作流组织</p>
  </div>
  <div id="nav" data-page-node-id="YVHUOkSyBvPrSiLulyz3BL"></div>
</aside>
<main data-page-node-id="4hEQdtAqwfuVaBUI5RkVfn">
  <header data-page-node-id="qawlXCfnGjkdmxfsRzORD2">
    <div class="dot" data-page-node-id="9ZVZHr5xKBywHEfPtWBaKk"></div><span id="head" data-page-node-id="319Vt0aHhI2bb5oGFpIjC2">新品 SOP</span><span class="crumb" id="crumb" data-page-node-id="MHBQUUv5Fh8FT1tKSoanKA"></span>
    <a id="back" href="#" onclick="return backHub()" style="display:none" data-page-node-id="2j2uwQ4GxR2XhfluQriXDl">← 返回板块</a>
    <a id="raw" href="tools/hub-sop.html" target="_blank" data-page-node-id="pUdTs96TwyI61CcpdbBa4t">单独打开 ↗</a>
  </header>
  <iframe id="frame" src="tools/hub-sop.html" data-page-node-id="B5lCyw8DAvPFmSFSpkaxZS"></iframe>
</main>
<script>
const STRUCT=[
 {id:'sop',name:'🧭 新品 SOP',desc:'25 节点排期 · 上架后复盘'},
 {id:'market',name:'🔭 市场洞察',desc:'流量趋势 · 需求 · 类目 · 选品'},
 {id:'comp',name:'🎯 竞品分析',desc:'Listing · 关键词 · 广告 · 监控'},
 {id:'supply',name:'💰 备货与算钱',desc:'补货 · 成本核算 · 各类算钱'},
 {id:'listing',name:'📝 Listing 物料',desc:'关键词 · 文案 · 图片 · A+ · 检查'},
 {id:'ads',name:'📊 广告',desc:'词库 · 架构 · 分析优化'},
 {id:'risk',name:'🛡 风险体检',desc:'合规 · 账号 · 侵权'}
];
let curHub='sop',curHubName='新品 SOP';
const nav=document.getElementById('nav');
STRUCT.forEach((s,i)=>{
  const g=document.createElement('div');g.className='group';
  g.innerHTML='<div class="group-title">板块 '+String(i+1).padStart(2,'0')+'</div>';
  const b=document.createElement('button');
  b.className='nav-item'+(i===0?' active':'');
  b.dataset.id=s.id;
  b.innerHTML='<span class="cnt">'+String(i+1).padStart(2,'0')+'</span>'+s.name+'<small>'+s.desc+'</small>';
  b.onclick=()=>go(s.id,s.name);
  g.appendChild(b);nav.appendChild(g);
});
function go(id,name){
  curHub=id;curHubName=name;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  const btn=document.querySelector('.nav-item[data-id="'+id+'"]');
  if(btn)btn.classList.add('active');
  setHead(name,'');
  document.getElementById('frame').src='tools/hub-'+id+'.html';
  document.getElementById('raw').href='tools/hub-'+id+'.html';
  document.getElementById('back').style.display='none';
  location.hash=id;
}
function openTool(fid,name){
  setHead(name,curHubName);
  document.getElementById('frame').src='tools/'+fid+'.html';
  document.getElementById('raw').href='tools/'+fid+'.html';
  document.getElementById('back').style.display='';
}
function backHub(){go(curHub,curHubName);return false;}
function setHead(t,crumb){
  document.getElementById('head').textContent=t;
  document.getElementById('crumb').textContent=crumb?('— '+crumb):'';
}
const start=location.hash.replace('#','');
if(start&&STRUCT.some(s=>s.id===start)){
  const s=STRUCT.find(x=>x.id===start);go(s.id,s.name);
}
</script>
</body>
</html>
