<script>
const frame=document.getElementById('frame'),fallback=document.getElementById('fallback'),status=document.getElementById('status');
function showFallback(msg){status.textContent=msg;status.style.display='block';frame.style.display='none';fallback.style.display='flex';}

  status.style.display='block';
  try{
    const r=await fetch('http://127.0.0.1:8765/api/meta',{cache:'no-store'});

    frame.src='http://127.0.0.1:8765/?t='+Date.now();

  }
}
probe();
</script>
